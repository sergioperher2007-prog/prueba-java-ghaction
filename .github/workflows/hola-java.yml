
name: Java Compilar y Ejecutar

on: push

jobs:
  compile:
    name: Compilar Java
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Compilar
        run: javac HolaMundo.java

      - name: Guardar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: java-classes
          path: "*.class"

  execute:
    name: Ejecutar Java
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Descargar archivos compilados
        uses: actions/download-artifact@v4
        with:
          name: java-classes

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Ejecutar
        run: java HolaMundo
